<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="700" height="300" fill="#fafaf9"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/>
    </marker>
    <marker id="arrow-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9f1239"/>
    </marker>
  </defs>

  <!-- Gate row -->
  <g stroke="#d6d3d1" fill="#ffffff">
    <rect x="16"  y="36" width="148" height="64" rx="8"/>
    <rect x="194" y="36" width="148" height="64" rx="8"/>
    <rect x="372" y="36" width="148" height="64" rx="8"/>
    <rect x="550" y="36" width="134" height="64" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1c1917">
    <text x="90"  y="59" font-size="13" fill="#9f1239" font-weight="600">Gate 1</text>
    <text x="90"  y="77" font-size="12">Branch protection</text>
    <text x="90"  y="91" font-size="12">+ code ownership</text>
    <text x="268" y="59" font-size="13" fill="#9f1239" font-weight="600">Gate 2</text>
    <text x="268" y="77" font-size="12">Deployment requires</text>
    <text x="268" y="91" font-size="12">explicit approval</text>
    <text x="446" y="59" font-size="13" fill="#9f1239" font-weight="600">Gate 3</text>
    <text x="446" y="77" font-size="12">Secrets never in</text>
    <text x="446" y="91" font-size="12">source control</text>
    <text x="617" y="59" font-size="13" fill="#9f1239" font-weight="600">Gate 4</text>
    <text x="617" y="77" font-size="12">Release whitelist —</text>
    <text x="617" y="91" font-size="12">visibility is an act</text>
  </g>

  <!-- Arrows between gates -->
  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="166" y1="68" x2="192" y2="68" marker-end="url(#arrow)"/>
    <line x1="344" y1="68" x2="370" y2="68" marker-end="url(#arrow)"/>
    <line x1="522" y1="68" x2="548" y2="68" marker-end="url(#arrow)"/>
  </g>

  <!-- Down from Gate 4 to the fork -->
  <g stroke="#d6d3d1" stroke-width="1.5" fill="none">
    <line x1="617" y1="100" x2="617" y2="132"/>
    <line x1="250" y1="132" x2="617" y2="132"/>
  </g>
  <text x="380" y="124" font-size="12" fill="#57534e">Gate 4 checks one question: is the validation memo complete and signed?</text>

  <g stroke="#1c1917" stroke-width="1.5" fill="none">
    <line x1="250" y1="132" x2="250" y2="168" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#9f1239" stroke-width="1.5" fill="none">
    <line x1="470" y1="132" x2="470" y2="168" marker-end="url(#arrow-block)"/>
  </g>

  <!-- Outcome row -->
  <g stroke="#d6d3d1" fill="#ffffff">
    <rect x="140" y="172" width="220" height="64" rx="8"/>
    <rect x="380" y="172" width="220" height="64" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="250" y="198" font-size="14" font-weight="600" fill="#1c1917">Memo approved</text>
    <text x="250" y="218" font-size="13" fill="#57534e">app becomes reachable to users</text>
    <text x="490" y="198" font-size="14" font-weight="600" fill="#9f1239">No memo, no release</text>
    <text x="490" y="218" font-size="13" fill="#57534e">merged code stays dark</text>
  </g>

  <text x="350" y="276" font-size="12" fill="#57534e" text-anchor="middle">The author of an app cannot approve its own release — Gates 2 and 4 belong to the platform maintainer.</text>
</svg>
