name: content-qc

# Manual-only on the trusted self-hosted runner. Pull requests from forks never
# execute here; daily PRs are already checked before creation by pharma-daily.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: [self-hosted, pharma]
    defaults:
      run:
        shell: "C:/Users/JaimeYan/AppData/Local/Programs/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qc:blog
      - run: npm run qc:assets
