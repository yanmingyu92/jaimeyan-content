name: content-qc

# Manual-only on a GitHub-hosted runner; daily PRs are already checked before
# creation by pharma-daily.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run qc:blog
      - run: npm run qc:assets
