# After a daily review PR is merged, render and publish its companion video,
# write videoId back to the article, and push. The push triggers the site deploy.
name: pharma-video

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      slug:
        description: 'post slug, e.g. pharma-daily-2026-09-05'
        required: true

permissions:
  contents: write

concurrency:
  group: pharma-video
  cancel-in-progress: false

jobs:
  video:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'pharma-daily/'))
    runs-on: [self-hosted, pharma]
    defaults:
      run:
        shell: "C:/Users/JaimeYan/AppData/Local/Programs/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve slug
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLUG=${{ inputs.slug }}" >> "$GITHUB_ENV"
          else
            REF="${{ github.event.pull_request.head.ref }}"
            echo "SLUG=pharma-daily-${REF#pharma-daily/}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Chrome for slide rendering
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: |
          npm ci
          cd tools/video
          npm ci
          uv sync --locked

      - name: Use existing local YouTube OAuth files
        run: |
          echo "VIDEO_TOOL_ROOT=C:/Users/JaimeYan/OneDrive - Kardigan/personal_testing/clinivista_docker/jaimeyan-site/tools/video" >> "$GITHUB_ENV"
          if [ ! -s "$VIDEO_TOOL_ROOT/.google-client-secret.json" ] || [ ! -s "$VIDEO_TOOL_ROOT/.google-token.json" ]; then
            echo "::error::Run npm run video:auth in the private site checkout first."
            exit 1
          fi

      - name: Configure git identity for write-back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Render, upload, and write back videoId
        run: npm run video:release -- "$SLUG" --public
