name: syndicate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'

permissions:
  contents: read

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run syndication pipeline
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
        run: node scripts/syndicate/run.mjs
      - name: Upload review drafts
        uses: actions/upload-artifact@v7
        with:
          name: review-drafts
          path: review/
          if-no-files-found: ignore
          retention-days: 14
