name: devto-weekly-publish

on:
  workflow_dispatch:
  schedule:
    - cron: '42 15 * * 4'

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, pharma]
    defaults:
      run:
        shell: "C:/Users/JaimeYan/AppData/Local/Programs/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Publish next 2 drafts
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          CONTENT_ENV_FILE: C:/Users/JaimeYan/OneDrive - Kardigan/personal_testing/clinivista_docker/jaimeyan-site/.env
        run: node scripts/devto-publish-weekly.mjs --max 2
