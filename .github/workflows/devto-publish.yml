name: devto-weekly-publish

on:
  workflow_dispatch:
  schedule:
    - cron: '42 15 * * 4'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Publish next 2 drafts
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        run: node scripts/devto-publish-weekly.mjs --max 2
